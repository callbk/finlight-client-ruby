name: Release

# Publishes the tagged version to RubyGems via OIDC trusted publishing: no API key or secret.
# One-time setup on rubygems.org (Dashboard -> Trusted publishers):
#   gem name:          finlight-client
#   repository owner:  callbk
#   repository name:   finlight-client-ruby
#   workflow filename: release.yml
#   environment:       ruby

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: ruby
    permissions:
      contents: write # release-gem runs `rake release`, which pushes the version tag
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check tag matches the gem version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GEM_VERSION="$(ruby -r ./lib/finlight/version -e 'puts Finlight::VERSION')"
          if [ "$VERSION" != "$GEM_VERSION" ]; then
            echo "tag v${VERSION} does not match Finlight::VERSION ${GEM_VERSION}" >&2
            exit 1
          fi
      - name: Package contents (built from a clean checkout into an empty folder)
        run: ruby scripts/check_package.rb
      - name: Publish to RubyGems (trusted publishing)
        uses: rubygems/release-gem@v1

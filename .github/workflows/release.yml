name: Release

# Publishes the tagged version to RubyGems via OIDC trusted publishing —
# no API key or secret involved. One-time setup on rubygems.org
# (Dashboard -> Trusted publishers -> pending publisher for a new gem):
#   gem name:          finlight-client
#   repository owner:  callbk
#   repository name:   finlight-client-ruby
#   workflow filename: release.yml
#   environment:       ruby

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ruby
    permissions:
      contents: write # release-gem runs `rake release`, which pushes the version tag
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check tag matches gem version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GEM_VERSION="$(ruby -r ./lib/finlight/client/version -e 'puts Finlight::Client::VERSION')"
          if [ "$VERSION" != "$GEM_VERSION" ]; then
            echo "tag v${VERSION} does not match Finlight::Client::VERSION ${GEM_VERSION}" >&2
            exit 1
          fi
      - name: Test
        run: bundle exec rake
      - name: Publish to RubyGems (trusted publishing)
        uses: rubygems/release-gem@v1
